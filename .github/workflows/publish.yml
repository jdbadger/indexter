name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv build
      - run: uv run python scripts/check_dist.py
      - name: Verify release tag matches package version
        run: |
          version=$(uv version --short)
          tag="${{ github.event.release.tag_name }}"
          if [ "${tag}" != "v${version}" ]; then
            echo "Release tag '${tag}' does not match package version 'v${version}'" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv publish --publish-url https://test.pypi.org/legacy/

  publish-pypi:
    if: "!github.event.release.prerelease"
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv publish
