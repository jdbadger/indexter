[project]
name = "indexter"
version = "0.1.2"
description = "MCP server for enhanced codebase context via RAG"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Joe Badger"}
]
keywords = ["mcp", "rag", "vector-search", "tree-sitter", "code-indexing", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "docker>=7.1.0",
    "fastmcp>=3.2.0",
    "pathspec>=1.0.4",
    "qdrant-client[fastembed]>=1.17.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "tomlkit>=0.14.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=1.4.0",
    "watchfiles>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest-testmon>=2.2.0",
    "ruff>=0.15.8",
    "rust-just>=1.48.1",
    "ty>=0.0.26",
]
test = [
    {include-group = "dev"},
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-testmon>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/jdbadger/indexter"
Repository = "https://github.com/jdbadger/indexter"
Documentation = "https://github.com/jdbadger/indexter#readme"
"Bug Tracker" = "https://github.com/jdbadger/indexter/issues"
Changelog = "https://github.com/jdbadger/indexter/blob/main/CHANGELOG.md"

[project.scripts]
indexter-mcp = "indexter.mcp.server:server.run"

[build-system]
requires = ["uv_build>=0.9.18,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
wheel-exclude = ["**/tests", "**/tests/**", "**/conftest.py", "**/__pycache__"]
source-exclude = ["**/tests", "**/tests/**", "**/conftest.py", "**/__pycache__"]

[tool.pytest.ini_options]
addopts = ["--pyargs"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py", "*_tests.py"]
markers = [
    "integration: marks tests as integration tests (require Docker)",
]

[tool.ruff]
indent-width = 4
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]
fixable = ["E", "F", "I", "UP"]
unfixable = ["S", "B"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S"]

[tool.ty.src]
exclude = ["**/tests/**", "**/test_*.py", "**/conftest.py"]

[tool.ty.environment]
python-version = "3.13"
